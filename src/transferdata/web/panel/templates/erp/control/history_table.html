<div class="table-responsive"><table class="table"><tr><th>Запуск</th><th>Задание</th><th>Дата</th><th>Статус</th><th>Длительность, с</th><th>Строк</th><th>Инициатор</th></tr>{% for e in recent %}<tr><td><a href="{% url 'erp:execution_detail' e.pk %}">#{{ e.pk }}</a></td><td>{{ e.job }}</td><td>{{ e.created_at }}</td><td class="status-{{ e.status }}">{{ e.status }}</td><td>{{ e.duration_seconds|default_if_none:'—' }}</td><td>{{ e.rows_loaded }}</td><td>{{ e.triggered_by|default:'Планировщик' }} / {{ e.trigger_type }}</td></tr>{% empty %}<tr><td>Запусков пока нет.</td></tr>{% endfor %}</table></div>
