{% extends 'erp/base.html' %}{% block erp_content %}<h2>История запусков</h2><form class="row g-2 mb-3"><div class="col"><select name="job" class="form-select"><option value="">Все задания</option>{% for j in jobs %}<option value="{{ j.pk }}">{{ j.name }}</option>{% endfor %}</select></div><div class="col"><select name="status" class="form-select"><option value="">Все статусы</option>{% for value,label in statuses %}<option>{{ value }}</option>{% endfor %}</select></div><div class="col"><select name="trigger" class="form-select"><option value="">Все типы</option><option>MANUAL</option><option>SCHEDULED</option></select></div><div class="col"><input aria-label="С даты" type="date" name="from" class="form-control"></div><div class="col"><input aria-label="По дату" type="date" name="to" class="form-control"></div><div class="col"><button class="btn btn-primary">Фильтр</button></div></form>{% include 'erp/control/history_table.html' with recent=page %}<p>Страница {{ page.number }} / {{ page.paginator.num_pages }}</p>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&job={{ request.GET.job }}&status={{ request.GET.status }}&trigger={{ request.GET.trigger }}&from={{ request.GET.from }}&to={{ request.GET.to }}">Далее</a>{% endif %}{% endblock %}
