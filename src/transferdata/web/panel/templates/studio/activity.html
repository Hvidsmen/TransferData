<aside id="live-activity" data-live class="surface activity"><div class="section-heading"><div><h2>Активность</h2><p>Операции за последние 7 дней</p></div><span class="small-chip">7 дней</span></div><div class="bar-chart">{% for day in activity %}<div class="bar-col"><span class="bar-count">{{ day.count }}</span><div class="bar-track"><div class="bar {% if forloop.last %}today{% endif %}" style="height:{{ day.height }}%"></div></div><span class="bar-day">{{ day.day|date:"d.m" }}</span></div>{% endfor %}</div><div class="activity-foot"><span class="dot blue-dot"></span>{{ activity_caption|default:"Все операции, включая проверки" }}</div></aside>
