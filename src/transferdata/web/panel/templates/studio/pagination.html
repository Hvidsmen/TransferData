{% if page.paginator.num_pages > 1 %}<div class="pagination"><span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="btn secondary small" href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ status|urlencode }}&amp;group={{ group|urlencode }}">Назад</a>{% endif %}{% if page.has_next %}<a class="btn secondary small" href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}&amp;status={{ status|urlencode }}&amp;group={{ group|urlencode }}">Далее</a>{% endif %}</div></div>{% endif %}
