{% load static %}<form id="bulk-jobs" class="surface filterbar bulk-bar" method="post" action="{% if subsystem == 'python' %}{% url 'python_jobs:bulk' %}{% elif subsystem == 'erp' %}{% url 'erp:job_bulk' %}{% else %}{% url 'td_bulk' %}{% endif %}">{% csrf_token %}
<label><input type="checkbox" id="select-all-jobs"> Все на странице</label><span id="selection-count" aria-live="polite">Выбрано: 0</span>
<select name="operation" aria-label="Действие с выбранными заданиями"><option value="group">Назначить группу</option><option value="restart">Запустить повторно</option><option value="archive">В архив</option><option value="restore">Вернуть из архива</option><option value="delete">Удалить</option></select>
<select data-searchable="true" name="group" aria-label="Группа для назначения"><option value="">Без группы</option>{% for item in groups %}<option value="{{ item.pk }}">{{ item.name }}</option>{% endfor %}</select><button class="btn primary" id="apply-bulk" disabled>Применить</button><a class="text-link" href="{% url 'etl_groups' %}">Справочник групп</a></form><script defer src="{% static 'panel/bulk.js' %}"></script>
