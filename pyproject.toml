[project]
name = "transferdata"
version = "0.1.0"
description = "Scheduled SQL Server to PostgreSQL ETL for Windows"
requires-python = ">=3.12"
dependencies = [
  "APScheduler>=3.11,<4",
  "SQLAlchemy>=2.0.40,<2.1",
  "oracledb>=3,<4",
  "pymssql>=2.3.4,<3",
  "psycopg[binary]>=3.2,<4",
  "portalocker>=3,<4",
  "pyodbc>=5.2,<6",
  "tzdata>=2025.2",
  "Django>=5.2,<5.3",
  "waitress>=3,<4",
  "whitenoise>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-django>=4.8,<5"]

[project.scripts]
transferdata = "transferdata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "transferdata.web.settings"
markers = ["mssql: requires real SQL Server and ODBC Driver 18"]
