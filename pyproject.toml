[project]
name = "transferdata"
version = "0.1.0"
description = "Scheduled SQL Server to PostgreSQL ETL for Windows"
requires-python = ">=3.12"
dependencies = [
  "APScheduler>=3.11,<4",
  "SQLAlchemy>=2.0.40,<2.1",
  "oracledb>=3,<4",
  "pymssql>=2.3.4,<3",
  "psycopg[binary]>=3.2,<4",
  "portalocker>=3,<4",
  "pyodbc>=5.2,<6; sys_platform == 'win32'",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
transferdata = "transferdata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
